
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAC-MAZE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b20;color:white;
 font-family:Arial,sans-serif;text-align:center;
 overflow-x:hidden
}
h1{
 color:#ffe600;letter-spacing:5px;
 text-shadow:0 0 15px #ffe600;
 margin:18px 0 8px
}
#stats{
 display:flex;justify-content:center;
 gap:22px;flex-wrap:wrap;margin:12px
}
.stat{font-size:16px;color:#fff}
.stat b{color:#ffe600}
#game{
 width:min(94vw,650px);
 margin:12px auto;
 background:#000;
 border:3px solid #263bff;
 border-radius:10px;
 box-shadow:0 0 25px #1528ff66;
 display:block
}
#message{
 min-height:28px;color:#ffe600;
 font-weight:bold;margin:10px
}
button{
 background:#263bff;color:white;
 border:0;border-radius:10px;
 padding:12px 22px;font-size:16px;
 font-weight:bold;margin:5px;cursor:pointer
}
button:active{transform:scale(.95)}
#controls{
 display:grid;grid-template-columns:60px 60px 60px;
 grid-template-rows:55px 55px;
 justify-content:center;gap:5px;margin:12px auto
}
#controls button{padding:0;font-size:24px}
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
small{color:#aab2df}
</style>
</head>
<body>
<h1>PAC-MAZE</h1>

<div id="stats">
 <div class="stat">SCORE <b id="score">0</b></div>
 <div class="stat">LIFE <b id="life">3</b></div>
 <div class="stat">STAGE <b id="stage">1</b></div>
</div>

<canvas id="game" width="600" height="600"></canvas>
<div id="message">スタートを押して冒険開始！</div>

<button onclick="startGame()">▶ START</button>
<button onclick="pauseGame()">Ⅱ PAUSE</button>

<div id="controls">
 <button id="up">▲</button>
 <button id="left">◀</button>
 <button id="down">▼</button>
 <button id="right">▶</button>
</div>
<small>矢印キー / WASD / タッチ操作</small>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const COLS=25,ROWS=25;
const SIZE=24;
const W=COLS*SIZE,H=ROWS*SIZE;

canvas.width=W;
canvas.height=H;

let map=[];
let pellets=[];
let powerPellets=[];
let player;
let ghosts=[];
let score=0,life=3,stage=1;
let running=false,paused=false;
let powerTime=0;
let lastTime=0;
let moveTimer=0;
let ghostTimer=0;
let message="";

const dirs={
 up:{x:0,y:-1},
 down:{x:0,y:1},
 left:{x:-1,y:0},
 right:{x:1,y:0}
};

let wanted={x:0,y:0};

function makeMaze(){
 map=Array.from({length:ROWS},()=>Array(COLS).fill(1));

 // ランダム迷路を作る
 const visited=new Set();
 const stack=[];
 const start={x:1,y:1};

 map[start.y][start.x]=0;
 visited.add("1,1");
 stack.push(start);

 while(stack.length){
  const p=stack[stack.length-1];
  const choices=[];

  for(const d of Object.values(dirs)){
   const nx=p.x+d.x*2;
   const ny=p.y+d.y*2;
   const key=nx+","+ny;

   if(nx>0&&nx<COLS-1&&ny>0&&ny<ROWS-1&&!visited.has(key)){
    choices.push({x:nx,y:ny,dx:d.x,dy:d.y});
   }
  }

  if(choices.length){
   const c=choices[Math.floor(Math.random()*choices.length)];
   map[p.y+c.dy][p.x+c.dx]=0;
   map[c.y][c.x]=0;
   visited.add(c.x+","+c.y);
   stack.push({x:c.x,y:c.y});
  }else{
   stack.pop();
  }
 }

 // 通路を増やして遊びやすくする
 for(let i=0;i<55;i++){
  const x=1+Math.floor(Math.random()*(COLS-2));
  const y=1+Math.floor(Math.random()*(ROWS-2));
  if(map[y][x]===1){
   let around=0;
   if(map[y-1]?.[x]===0)around++;
   if(map[y+1]?.[x]===0)around++;
   if(map[y]?.[x-1]===0)around++;
   if(map[y]?.[x+1]===0)around++;
   if(around>=2)map[y][x]=0;
  }
 }

 // 外周を壁にする
 for(let x=0;x<COLS;x++){
  map[0][x]=1;
  map[ROWS-1][x]=1;
 }
 for(let y=0;y<ROWS;y++){
  map[y][0]=1;
  map[y][COLS-1]=1;
 }

 // スタート地点周辺を開ける
 for(let y=1;y<=3;y++){
  for(let x=1;x<=3;x++)map[y][x]=0;
 }
}

function isWall(x,y){
 if(x<0||y<0||x>=COLS||y>=ROWS)return true;
 return map[y][x]===1;
}

function newStage(){
 makeMaze();

 player={x:1,y:1,dir:{x:0,y:0}};
 wanted={x:0,y:0};

 pellets=[];
 powerPellets=[];

 for(let y=1;y<ROWS-1;y++){
  for(let x=1;x<COLS-1;x++){
   if(map[y][x]===0&&!(x===1&&y===1)){
    pellets.push({x,y});
   }
  }
 }

 // パワーエサを四隅付近に配置
 const corners=[
  {x:1,y:ROWS-2},
  {x:COLS-2,y:1},
  {x:COLS-2,y:ROWS-2},
  {x:Math.floor(COLS/2),y:Math.floor(ROWS/2)}
 ];

 for(const p of corners){
  if(!isWall(p.x,p.y)){
   powerPellets.push({...p});
   pellets=pellets.filter(a=>a.x!==p.x||a.y!==p.y);
  }
 }

 ghosts=[
  {x:COLS-2,y:ROWS-2,color:"#ff3030",home:{x:COLS-2,y:ROWS-2}},
  {x:COLS-2,y:ROWS-3,color:"#ff8de1",home:{x:COLS-2,y:ROWS-3}},
  {x:COLS-3,y:ROWS-2,color:"#00eaff",home:{x:COLS-3,y:ROWS-2}},
  {x:COLS-3,y:ROWS-3,color:"#ff9b25",home:{x:COLS-3,y:ROWS-3}}
 ];

 // ゴーストの位置を通路に調整
 ghosts.forEach(g=>{
  if(isWall(g.x,g.y)){
   const p=findOpenTile();
   g.x=p.x;g.y=p.y;
  }
 });

 powerTime=0;
}

function findOpenTile(){
 for(let i=0;i<1000;i++){
  const x=1+Math.floor(Math.random()*(COLS-2));
  const y=1+Math.floor(Math.random()*(ROWS-2));
  if(!isWall(x,y)&&!(x===1&&y===1))return{x,y};
 }
 return{x:COLS-2,y:ROWS-2};
}

function startGame(){
 score=0;life=3;stage=1;
 newStage();
 running=true;paused=false;
 message="";
 updateStats();
 lastTime=performance.now();
 requestAnimationFrame(loop);
}

function pauseGame(){
 if(!running)return;
 paused=!paused;
 message=paused?"一時停止中":"";
 if(!paused){
  lastTime=performance.now();
  requestAnimationFrame(loop);
 }
}

function updateStats(){
 document.getElementById("score").textContent=score;
 document.getElementById("life").textContent=life;
 document.getElementById("stage").textContent=stage;
}

function setDirection(d){
 wanted={...dirs[d]};
}

document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 const keys={
  arrowup:"up",w:"up",
  arrowdown:"down",s:"down",
  arrowleft:"left",a:"left",
  arrowright:"right",d:"right"
 };
 if(keys[k]){
  e.preventDefault();
  setDirection(keys[k]);
 }
 if(k===" "){
  e.preventDefault();
  pauseGame();
 }
});

for(const d of Object.keys(dirs)){
 const btn=document.getElementById(d);
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();setDirection(d);
 });
}

function canMove(x,y,d){
 return !isWall(x+d.x,y+d.y);
}

function movePlayer(){
 if(canMove(player.x,player.y,wanted)){
  player.dir={...wanted};
 }
 if(canMove(player.x,player.y,player.dir)){
  player.x+=player.dir.x;
  player.y+=player.dir.y;
 }

 const i=pellets.findIndex(p=>p.x===player.x&&p.y===player.y);
 if(i!==-1){
  pellets.splice(i,1);
  score+=10;
 }

 const pi=powerPellets.findIndex(p=>p.x===player.x&&p.y===player.y);
 if(pi!==-1){
  powerPellets.splice(pi,1);
  score+=50;
  powerTime=8;
 }

 if(pellets.length===0){
  stage++;
  newStage();
  message="STAGE "+stage+"!";
 }

 updateStats();
}

function bfs(sx,sy,tx,ty){
 const queue=[{x:sx,y:sy,first:null}];
 const seen=new Set([sx+","+sy]);

 while(queue.length){
  const p=queue.shift();
  if(p.x===tx&&p.y===ty)return p.first;

  for(const d of Object.values(dirs)){
   const nx=p.x+d.x,ny=p.y+d.y;
   const key=nx+","+ny;
   if(!isWall(nx,ny)&&!seen.has(key)){
    seen.add(key);
    queue.push({
     x:nx,y:ny,
     first:p.first||d
    });
   }
  }
 }
 return null;
}

function moveGhosts(){
 for(const g of ghosts){
  let target;

  if(powerTime>0){
   target=bfs(g.x,g.y,g.home.x,g.home.y);
   if(!target){
    target={x:-wanted.x,y:-wanted.y};
   }else{
    target={x:-target.x,y:-target.y};
   }
  }else{
   target=bfs(g.x,g.y,player.x,player.y);
  }

  if(target&&!isWall(g.x+target.x,g.y+target.y)){
   g.x+=target.x;
   g.y+=target.y;
  }
 }
}

function checkCollision(){
 for(const g of ghosts){
  if(g.x===player.x&&g.y===player.y){
   if(powerTime>0){
    score+=200;
    const p=findOpenTile();
    g.x=p.x;g.y=p.y;
    updateStats();
   }else{
    life--;
    updateStats();

    if(life<=0){
     running=false;
     message="GAME OVER";
     return;
    }

    player.x=1;player.y=1;
    player.dir={x:0,y:0};
    wanted={x:0,y:0};
    message="気をつけて！";
   }
  }
 }
}

function loop(time){
 if(!running||paused)return;

 const dt=Math.min((time-lastTime)/1000,.05);
 lastTime=time;

 moveTimer+=dt;
 ghostTimer+=dt;

 if(moveTimer>.135){
  moveTimer=0;
  movePlayer();
  checkCollision();
 }

 if(ghostTimer>.24){
  ghostTimer=0;
  moveGhosts();
  checkCollision();
 }

 if(powerTime>0)powerTime-=dt;

 draw();

 if(running)requestAnimationFrame(loop);
}

function draw(){
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,W,H);

 // 迷路
 for(let y=0;y<ROWS;y++){
  for(let x=0;x<COLS;x++){
   if(map[y][x]===1){
    ctx.fillStyle="#101b80";
    ctx.fillRect(x*SIZE,y*SIZE,SIZE,SIZE);
    ctx.strokeStyle="#526cff";
    ctx.lineWidth=1;
    ctx.strokeRect(x*SIZE+2,y*SIZE+2,SIZE-4,SIZE-4);
   }
  }
 }

 // ドット
 ctx.fillStyle="#ffe9b0";
 for(const p of pellets){
  ctx.beginPath();
  ctx.arc(p.x*SIZE+SIZE/2,p.y*SIZE+SIZE/2,3,0,Math.PI*2);
  ctx.fill();
 }

 // パワーエサ
 for(const p of powerPellets){
  ctx.fillStyle="#fff";
  ctx.shadowColor="#fff";
  ctx.shadowBlur=15;
  ctx.beginPath();
  ctx.arc(p.x*SIZE+SIZE/2,p.y*SIZE+SIZE/2,7,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
 }

 // ゴースト
 for(const g of ghosts){
  drawGhost(g);
 }

 // パックマン
 drawPlayer();

 if(powerTime>0){
  ctx.fillStyle="#7dfcff";
  ctx.font="bold 15px Arial";
  ctx.fillText("POWER!",10,20);
 }

 if(message){
  ctx.fillStyle="#ffe600";
  ctx.font="bold 25px Arial";
  ctx.textAlign="center";
  ctx.fillText(message,W/2,H/2);
  ctx.textAlign="left";
 }
}

function drawPlayer(){
 const cx=player.x*SIZE+SIZE/2;
 const cy=player.y*SIZE+SIZE/2;
 const angle=Math.atan2(player.dir.y,player.dir.x);
 const mouth=.25+Math.abs(Math.sin(Date.now()/80))*.25;

 ctx.fillStyle="#ffe600";
 ctx.beginPath();
 ctx.moveTo(cx,cy);
 ctx.arc(cx,cy,SIZE*.43,angle+mouth,angle+Math.PI*2-mouth);
 ctx.closePath();
 ctx.fill();
}

function drawGhost(g){
 const x=g.x*SIZE+SIZE/2;
 const y=g.y*SIZE+SIZE/2;
 const r=SIZE*.4;

 ctx.fillStyle=powerTime>0?"#315aff":g.color;
 ctx.beginPath();
 ctx.arc(x,y-r*.15,r,Math.PI,0);
 ctx.lineTo(x+r,y+r);
 ctx.lineTo(x+r*.5,y+r*.65);
 ctx.lineTo(x,y+r);
 ctx.lineTo(x-r*.5,y+r*.65);
 ctx.lineTo(x-r,y+r);
 ctx.closePath();
 ctx.fill();

 // 目
 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(x-r*.35,y-r*.1,r*.22,0,Math.PI*2);
 ctx.arc(x+r*.35,y-r*.1,r*.22,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#111";
 ctx.beginPath();
 ctx.arc(x-r*.35,y-r*.1,r*.1,0,Math.PI*2);
 ctx.arc(x+r*.35,y-r*.1,r*.1,0,Math.PI*2);
 ctx.fill();
}

// 初期画面
makeMaze();
player={x:1,y:1,dir:{x:0,y:0}};
ghosts=[];
pellets=[];
powerPellets=[];
draw();
</script>
</body>
</html>
