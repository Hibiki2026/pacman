
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PAC-MAZE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050713;color:white;
 font-family:Arial,sans-serif;text-align:center;
 overflow-x:hidden;touch-action:pan-y;
}
header{padding:17px 8px 8px}
h1{
 margin:0;color:#ffe600;font-size:34px;
 letter-spacing:5px;text-shadow:0 0 15px #ffcc00;
}
.sub{color:#8995bd;font-size:12px;margin-top:5px}
.stats{
 display:flex;justify-content:center;gap:12px;
 flex-wrap:wrap;margin:14px 8px;
}
.stat{
 background:#111a32;border:1px solid #29385f;
 border-radius:10px;padding:9px 15px;min-width:85px;
}
.stat small{display:block;color:#91a2d0;font-size:11px}
.stat strong{font-size:19px;color:#fff}
#lives{color:#ff5050}
#gameBox{
 width:min(94vw,650px);margin:auto;
 background:#000;border:3px solid #243c91;
 border-radius:12px;padding:5px;
 box-shadow:0 0 25px #1738a5;
 position:relative;
}
canvas{
 width:100%;height:auto;display:block;
 image-rendering:pixelated;
}
#message{
 position:absolute;inset:0;
 display:flex;align-items:center;justify-content:center;
 background:#000b;z-index:3;
 flex-direction:column;padding:20px;
}
#message h2{color:#ffe600;font-size:30px;margin:0 0 10px}
#message p{color:#d3d9ed;font-size:14px;line-height:1.8}
button{
 background:linear-gradient(135deg,#ffdf00,#ff9900);
 border:0;border-radius:12px;padding:13px 25px;
 font-weight:bold;font-size:16px;color:#171000;
 cursor:pointer;margin:5px;
}
button:active{transform:scale(.95)}
.controls{
 display:grid;grid-template-columns:repeat(3,58px);
 grid-template-rows:repeat(2,52px);
 justify-content:center;gap:5px;margin:15px auto;
}
.controls button{
 margin:0;padding:0;font-size:23px;
 background:#18274b;color:white;
 border:1px solid #526aa9;
}
.controls button:nth-child(1){grid-column:2;grid-row:1}
.controls button:nth-child(2){grid-column:1;grid-row:2}
.controls button:nth-child(3){grid-column:2;grid-row:2}
.controls button:nth-child(4){grid-column:3;grid-row:2}
.help{font-size:12px;color:#7787b3;margin:12px}
#bottom{margin:15px;color:#62729d;font-size:11px}
</style>
</head>
<body>

<header>
<h1>PAC-MAZE</h1>
<div class="sub">RANDOM GENERATED MAZE</div>
</header>

<div class="stats">
 <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
 <div class="stat"><small>HIGH SCORE</small><strong id="high">0</strong></div>
 <div class="stat"><small>LIVES</small><strong id="lives">♥ ♥ ♥</strong></div>
 <div class="stat"><small>STAGE</small><strong id="stage">1</strong></div>
</div>

<div id="gameBox">
 <canvas id="game" width="552" height="552"></canvas>
 <div id="message">
  <h2>PAC-MAZE</h2>
  <p>迷路のドットを全部食べよう！<br>
  ゴーストに捕まらないように注意！<br>
  パワーエサでゴーストを撃退！<br>
  コースは毎回ランダム生成。</p>
  <button onclick="startGame()">GAME START</button>
 </div>
</div>

<div>
 <button onclick="togglePause()">Ⅱ PAUSE</button>
 <button onclick="startGame()">↻ NEW GAME</button>
</div>

<div class="controls">
 <button onclick="setDir(0,-1)">▲</button>
 <button onclick="setDir(-1,0)">◀</button>
 <button onclick="setDir(0,1)">▼</button>
 <button onclick="setDir(1,0)">▶</button>
</div>

<div class="help">操作：矢印キー / WASD / 画面ボタン</div>
<div id="bottom">PAC-MAZE · RANDOM MAZE SYSTEM</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=23,H=23,T=24;

let maze=[],dots=[],powers=[];
let player,ghosts=[];
let score=0,lives=3,stage=1,high=0;
let running=false,paused=false,gameOver=false;
let tick=0,powerTime=0;
let animation=0;
let lastTime=0;
let moveTimer=0;
let ghostTimer=0;
let mouth=0;
let direction={x:0,y:0};
let nextDirection={x:0,y:0};

try{high=Number(localStorage.getItem("pacmazeHigh"))||0}catch(e){}
document.getElementById("high").textContent=high;

const dirs=[
 {x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}
];

function randomMaze(){
 maze=Array.from({length:H},()=>Array(W).fill(1));

 // ランダム化深さ優先探索で迷路を生成
 let stack=[];
 let start={x:1,y:1};
 maze[start.y][start.x]=0;
 stack.push(start);

 while(stack.length){
  let current=stack[stack.length-1];
  let options=[];

  for(let d of dirs){
   let nx=current.x+d.x*2;
   let ny=current.y+d.y*2;

   if(nx>0&&ny>0&&nx<W-1&&ny<H-1&&maze[ny][nx]===1){
    options.push({x:nx,y:ny,dx:d.x,dy:d.y});
   }
  }

  if(options.length===0){
   stack.pop();
  }else{
   let next=options[Math.floor(Math.random()*options.length)];
   maze[current.y+next.dy][current.x+next.dx]=0;
   maze[next.y][next.x]=0;
   stack.push({x:next.x,y:next.y});
  }
 }

 // 壁を一部取り除いて複数のルートを作る
 for(let i=0;i<Math.floor(W*H*.10);i++){
  let x=2+Math.floor(Math.random()*(W-4));
  let y=2+Math.floor(Math.random()*(H-4));

  if(maze[y][x]===1){
   let horizontal=maze[y][x-1]===0&&maze[y][x+1]===0;
   let vertical=maze[y-1][x]===0&&maze[y+1][x]===0;
   if(horizontal||vertical)maze[y][x]=0;
  }
 }

 // 迷路の通路がつながるように補修
 ensureConnectivity();
}

function ensureConnectivity(){
 let first=null;
 for(let y=1;y<H-1;y++){
  for(let x=1;x<W-1;x++){
   if(maze[y][x]===0){first={x,y};break}
  }
  if(first)break;
 }
 if(!first)return;

 let visited=new Set();
 let queue=[first];
 visited.add(key(first.x,first.y));

 while(queue.length){
  let p=queue.shift();
  for(let d of dirs){
   let x=p.x+d.x,y=p.y+d.y;
   let k=key(x,y);
   if(x>0&&y>0&&x<W-1&&y<H-1&&
      maze[y][x]===0&&!visited.has(k)){
    visited.add(k);queue.push({x,y});
   }
  }
 }

 // 孤立部分を壁に戻す
 for(let y=1;y<H-1;y++){
  for(let x=1;x<W-1;x++){
   if(maze[y][x]===0&&!visited.has(key(x,y))){
    maze[y][x]=1;
   }
  }
}

function key(x,y){return x+","+y}
function walk(x,y){
 return x>=0&&y>=0&&x<W&&y<H&&maze[y][x]===0;
}

function farthestFrom(sx,sy,count){
 let distances=new Map();
 let queue=[{x:sx,y:sy,d:0}];
 distances.set(key(sx,sy),0);

 while(queue.length){
  let p=queue.shift();
  for(let d of dirs){
   let x=p.x+d.x,y=p.y+d.y,k=key(x,y);
   if(walk(x,y)&&!distances.has(k)){
    distances.set(k,p.d+1);
    queue.push({x,y,d:p.d+1});
   }
  }
 }

 return [...distances.entries()]
 .sort((a,b)=>b[1]-a[1])
 .slice(0,count)
 .map(a=>{
  let [x,y]=a[0].split(",").map(Number);
  return {x,y};
 });
}

function setupStage(){
 randomMaze();

 let open=[];
 for(let y=1;y<H-1;y++){
  for(let x=1;x<W-1;x++){
   if(walk(x,y))open.push({x,y});
  }
 }

 // プレイヤーのスタート位置
 let start={x:W-2,y:H-2};
 if(!walk(start.x,start.y)){
  start=open[open.length-1];
 }

 // ゴーストの基地を中央付近に配置
 let center={x:Math.floor(W/2),y:Math.floor(H/2)};
 let ghostHome=open
  .filter(p=>Math.abs(p.x-center.x)+Math.abs(p.y-center.y)<8)
  .sort((a,b)=>
   (Math.abs(a.x-center.x)+Math.abs(a.y-center.y))-
   (Math.abs(b.x-center.x)+Math.abs(b.y-center.y))
  )[0]||open[0];

 player={
  x:start.x,y:start.y,
  dir:{x:0,y:0},
  alive:true
 };

 direction={x:0,y:0};
 nextDirection={x:0,y:0};

 ghosts=[];
 let colors=["#ff4242","#ff9bdb","#42e8f5","#ffae32"];

 for(let i=0;i<4;i++){
  let candidates=open.filter(p=>
   Math.abs(p.x-ghostHome.x)+Math.abs(p.y-ghostHome.y)>=i+1
  );
  let pos=candidates.find(p=>
   !ghosts.some(g=>g.x===p.x&&g.y===p.y)
  )||ghostHome;

  ghosts.push({
   x:pos.x,y:pos.y,
   color:colors[i],
   home:{x:pos.x,y:pos.y},
   frightened:false,
   name:i
  });
 }

 dots=[];
 powers=[];

 for(let y=1;y<H-1;y++){
  for(let x=1;x<W-1;x++){
   if(!walk(x,y))continue;

   let nearPlayer=Math.abs(x-start.x)+Math.abs(y-start.y);
   let nearGhost=Math.abs(x-ghostHome.x)+Math.abs(y-ghostHome.y);

   if(nearPlayer===0||nearGhost<2)continue;

   dots.push({x,y});
  }
 }

 let powerPositions=farthestFrom(start.x,start.y,4);
 for(let p of powerPositions){
  if(p.x===start.x&&p.y===start.y)continue;
  powers.push({x:p.x,y:p.y});
  dots=dots.filter(d=>d.x!==p.x||d.y!==p.y);
 }

 powerTime=0;
}

function drawMaze(){
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 for(let y=0;y<H;y++){
  for(let x=0;x<W;x++){
   if(maze[y][x]===1){
    let px=x*T,py=y*T;
    ctx.fillStyle="#071b68";
    ctx.fillRect(px+1,py+1,T-2,T-2);

    ctx.strokeStyle="#2469ff";
    ctx.lineWidth=1.5;
    ctx.strokeRect(px+2,py+2,T-4,T-4);
   }
  }
 }

 // ドット
 ctx.fillStyle="#ffe9bd";
 for(let d of dots){
  ctx.beginPath();
  ctx.arc(d.x*T+T/2,d.y*T+T/2,2.5,0,Math.PI*2);
  ctx.fill();
 }

 // パワーエサ
 for(let p of powers){
  let pulse=1+Math.sin(tick*.009)*.22;
  ctx.fillStyle="#fff";
  ctx.shadowColor="#fff";
  ctx.shadowBlur=12;
  ctx.beginPath();
  ctx.arc(p.x*T+T/2,p.y*T+T/2,6*pulse,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
 }
}

function drawPlayer(){
 if(!player)return;
 let px=player.x*T+T/2;
 let py=player.y*T+T/2;

 let angle=0;
 if(direction.x===-1)angle=Math.PI;
 if(direction.y===-1)angle=-Math.PI/2;
 if(direction.y===1)angle=Math.PI/2;

 let opening=.12+Math.abs(Math.sin(mouth))*.35;

 ctx.fillStyle="#ffe600";
 ctx.beginPath();
 ctx.moveTo(px,py);
 ctx.arc(px,py,10,angle+opening,angle+Math.PI*2-opening);
 ctx.closePath();
 ctx.fill();

 ctx.shadowColor="#ffdd00";
 ctx.shadowBlur=8;
 ctx.fill();
 ctx.shadowBlur=0;
}

function drawGhost(g){
 let x=g.x*T+T/2;
 let y=g.y*T+T/2;
 let frightened=powerTime>0;
 let color=frightened?"#244bff":g.color;

 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.arc(x,y-1,9,Math.PI,0);
 ctx.lineTo(x+9,y+9);
 ctx.lineTo(x+4,y+6);
 ctx.lineTo(x,y+10);
 ctx.lineTo(x-4,y+6);
 ctx.lineTo(x-9,y+9);
 ctx.closePath();
 ctx.fill();

 // 目
 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.ellipse(x-3,y-1,3,4,0,0,Math.PI*2);
 ctx.ellipse(x+3,y-1,3,4,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#111";
 ctx.beginPath();
 ctx.arc(x-3,y,1.5,0,Math.PI*2);
 ctx.arc(x+3,y,1.5,0,Math.PI*2);
 ctx.fill();
}

function draw(){
 drawMaze();
 for(let g of ghosts)drawGhost(g);
 drawPlayer();
}

function setDir(x,y){
 nextDirection={x,y};
}

document.addEventListener("keydown",e=>{
 let map={
  ArrowUp:[0,-1],w:[0,-1],W:[0,-1],
  ArrowDown:[0,1],s:[0,1],S:[0,1],
  ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],
  ArrowRight:[1,0],d:[1,0],D:[1,0]
 };
 if(map[e.key]){
  e.preventDefault();
  setDir(...map[e.key]);
 }
 if(e.code==="Space"){
  e.preventDefault();
  togglePause();
 }
});

function movePlayer(){
 if(walk(player.x+nextDirection.x,player.y+nextDirection.y)){
  direction={...nextDirection};
 }

 if(walk(player.x+direction.x,player.y+direction.y)){
  player.x+=direction.x;
  player.y+=direction.y;
 }

 // ドット回収
 let index=dots.findIndex(d=>d.x===player.x&&d.y===player.y);
 if(index!==-1){
  dots.splice(index,1);
  score+=10;
  updateStats();
 }

 // パワーエサ
 let powerIndex=powers.findIndex(p=>p.x===player.x&&p.y===player.y);
 if(powerIndex!==-1){
  powers.splice(powerIndex,1);
  score+=50;
  powerTime=6500;
  updateStats();
 }

 if(dots.length===0&&powers.length===0){
  nextStage();
 }
}

function findPath(sx,sy,tx,ty){
 let queue=[{x:sx,y:sy,first:null}];
 let visited=new Set([key(sx,sy)]);

 while(queue.length){
  let p=queue.shift();
  if(p.x===tx&&p.y===ty)return p.first;

  for(let d of dirs){
   let x=p.x+d.x,y=p.y+d.y,k=key(x,y);
   if(walk(x,y)&&!visited.has(k)){
    visited.add(k);
    queue.push({
     x,y,
     first:p.first||{x:d.x,y:d.y}
    });
   }
  }
 }
 return null;
}

function moveGhost(g){
 let frightened=powerTime>0;
 let options=dirs.filter(d=>walk(g.x+d.x,g.y+d.y));
 if(!options.length)return;

 let chosen;

 if(frightened&&Math.random()<.7){
  // パワー中はプレイヤーから遠ざかる
  options.sort((a,b)=>{
   let da=Math.abs(g.x+a.x-player.x)+Math.abs(g.y+a.y-player.y);
   let db=Math.abs(g.x+b.x-player.x)+Math.abs(g.y+b.y-player.y);
   return db-da;
  });
  chosen=options[0];
 }else{
  chosen=findPath(g.x,g.y,player.x,player.y);
  if(!chosen||!options.some(d=>d.x===chosen.x&&d.y===chosen.y)){
   chosen=options[Math.floor(Math.random()*options.length)];
  }
 }

 g.x+=chosen.x;
 g.y+=chosen.y;
}

function checkCollision(){
 for(let g of ghosts){
  if(g.x===player.x&&g.y===player.y){
   if(powerTime>0){
    score+=200;
    g.x=g.home.x;
    g.y=g.home.y;
    updateStats();
   }else{
    loseLife();
    return;
   }
  }
 }
}

function loseLife(){
 lives--;
 updateStats();

 if(lives<=0){
  endGame();
  return;
 }

 // スタート位置に戻す
 let start={x:W-2,y:H-2};
 if(!walk(start.x,start.y)){
  start=maze.flatMap((row,y)=>row.map((v,x)=>({x,y,v})))
   .filter(p=>p.v===0).pop();
 }

 player.x=start.x;
 player.y=start.y;
 direction={x:0,y:0};
 nextDirection={x:0,y:0};

 ghosts.forEach(g=>{
  g.x=g.home.x;
  g.y=g.home.y;
 });

 powerTime=0;
}

function nextStage(){
 stage++;
 setupStage();
 updateStats();
}

function updateStats(){
 document.getElementById("score").textContent=score;
 document.getElementById("high").textContent=high;
 document.getElementById("lives").textContent=
  "♥ ".repeat(Math.max(0,lives));
 document.getElementById("stage").textContent=stage;

 if(score>high){
  high=score;
  try{localStorage.setItem("pacmazeHigh",high)}catch(e){}
  document.getElementById("high").textContent=high;
 }
}

function endGame(){
 running=false;
 gameOver=true;
 document.getElementById("message").style.display="flex";
 document.getElementById("message").innerHTML=`
  <h2>GAME OVER</h2>
  <p>FINAL SCORE<br>
  <strong style="font-size:30px;color:#ffe600">${score}</strong><br>
  STAGE ${stage}</p>
  <button onclick="startGame()">RETRY</button>
 `;
}

function togglePause(){
 if(!running||gameOver)return;
 paused=!paused;
 if(paused){
  document.getElementById("message").style.display="flex";
  document.getElementById("message").innerHTML=
  '<h2>PAUSED</h2><p>一時停止中</p><button onclick="togglePause()">CONTINUE</button>';
 }else{
  document.getElementById("message").style.display="none";
 }
}

function startGame(){
 score=0;
 lives=3;
 stage=1;
 running=true;
 paused=false;
 gameOver=false;
 setupStage();
 updateStats();
 document.getElementById("message").style.display="none";
 lastTime=0;
 moveTimer=0;
 ghostTimer=0;
 cancelAnimationFrame(animation);
 animation=requestAnimationFrame(loop);
}

function loop(timestamp){
 animation=requestAnimationFrame(loop);
 if(!running||paused)return;

 if(!lastTime)lastTime=timestamp;
 let delta=Math.min(timestamp-lastTime,50);
 lastTime=timestamp;
 tick+=delta;
 mouth+=delta*.012;

 moveTimer+=delta;
 ghostTimer+=delta;

 // プレイヤーの速度
 let playerSpeed=Math.max(85,125-(stage-1)*3);

 if(moveTimer>=playerSpeed){
  moveTimer=0;
  movePlayer();
  checkCollision();
 }

 // ゴーストの速度
 let ghostSpeed=Math.max(115,195-(stage-1)*3);
 if(ghostTimer>=ghostSpeed){
  ghostTimer=0;
  ghosts.forEach(g=>moveGhost(g));
  checkCollision();
 }

 if(powerTime>0){
  powerTime-=delta;
  if(powerTime<0)powerTime=0;
 }

 draw();
}

setupStage();
draw();
</script>
</body>
</html>
