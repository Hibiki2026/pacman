<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b20">
<title>PAC-MAZE</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080b20;color:#f5f6ff}*{box-sizing:border-box}body{margin:0;text-align:center;overscroll-behavior:none}main{width:min(94%,650px);margin:auto;padding:12px 0 max(24px,env(safe-area-inset-bottom))}h1{font-size:clamp(24px,6vw,36px);letter-spacing:5px;color:#ffe600;text-shadow:0 0 22px #ffe60066;margin:6px 0 14px}.stats{display:flex;justify-content:space-around;gap:10px;background:#111936;border:1px solid #29386b;border-radius:12px;padding:12px 6px}.stats span{font-size:12px;color:#aab2df}.stats b{display:block;font-size:23px;color:#ffe600;font-variant-numeric:tabular-nums}canvas{display:block;width:100%;height:auto;aspect-ratio:1;margin:12px auto;background:#02030a;border:2px solid #526cff;border-radius:10px;touch-action:none}#message{min-height:2.8em;margin:8px 0;color:#ffe600;font-weight:650;font-size:14px}button{font:inherit;font-weight:650;background:#293fff;color:#fff;border:1px solid transparent;border-radius:10px;padding:12px 16px;cursor:pointer;touch-action:manipulation}button:hover{background:#4055ff}button:focus-visible,textarea:focus-visible{outline:3px solid #ffe600;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.actions{display:flex;justify-content:center;gap:10px}.secondary{background:#172445;border-color:#405184}#controls{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,54px);justify-content:center;gap:7px;margin:14px auto}#controls button{font-size:25px;padding:0;touch-action:none;user-select:none;-webkit-user-select:none}#up{grid-area:1/2}#left{grid-area:2/1}#down{grid-area:2/2}#right{grid-area:2/3}small{display:block;font-size:12px;color:#b2bce6;line-height:1.7}.savebox{text-align:left;background:#111936;border:1px solid #29386b;border-radius:14px;padding:16px;margin-top:22px}h2{font-size:17px;margin:0 0 8px}textarea{width:100%;min-height:80px;resize:vertical;background:#070d25;color:#fff;border:1px solid #5366d8;border-radius:8px;padding:10px;font-size:14px;margin:10px 0}.savebox .actions{justify-content:flex-start;flex-wrap:wrap}#save-status{min-height:1.5em;color:#b8e9ff;font-size:13px;margin:10px 0 0}@media(max-height:700px) and (min-width:650px){main{width:min(70vh,650px)}}
</style>
</head>
<body>
<main>
<h1>PAC-MAZE</h1>
<div class="stats" aria-label="ゲームの成績"><div><span>SCORE</span><b id="score">0</b></div><div><span>LIFE</span><b id="life">3</b></div><div><span>STAGE</span><b id="stage">1</b></div></div>
<canvas id="game" width="600" height="600" aria-label="パックマンの迷路。矢印キー、WASD、下の方向ボタン、スワイプで操作できます"></canvas>
<div id="message" role="status" aria-live="polite">STARTを押してね！</div>
<div class="actions"><button id="start">▶ START / NEW GAME</button><button id="pause" class="secondary" disabled>Ⅱ PAUSE</button></div>
<div id="controls" aria-label="移動方向"><button id="up" aria-label="上へ">▲</button><button id="left" aria-label="左へ">◀</button><button id="down" aria-label="下へ">▼</button><button id="right" aria-label="右へ">▶</button></div>
<small>矢印キー / WASD / 方向ボタン / 迷路をスワイプ<br>曲がる方向は早めに入力OK・逆方向で即反転・Spaceで一時停止</small>
<section class="savebox"><h2>セーブ・引き継ぎ</h2><small>現在の状態をコードに保存。以前のバージョン3のコードも読み込めます。</small><label for="savecode">引き継ぎコード</label><textarea id="savecode" placeholder="引き継ぎコードを貼り付け" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea><div class="actions"><button id="copy">コードをコピー</button><button id="load" class="secondary">コードを読み込む</button></div><p id="save-status" role="status" aria-live="polite"></p></section>
</main>
<script>
'use strict';
// Simulation uses tile edges and a fixed clock. Rendering and input never advance it.
const N=25, S=24, STEP=1/120, EPS=1e-8;
const DIRS=[{x:0,y:-1,name:'up'},{x:0,y:1,name:'down'},{x:-1,y:0,name:'left'},{x:1,y:0,name:'right'}];
const ZERO={x:0,y:0};
const COLORS=['#ff424f','#ff8de1','#00eaff','#ffab42'];
const wrap=v=>(v%N+N)%N;
const key=(x,y)=>y*N+x;
const actor=(x,y)=>({tx:x,ty:y,progress:0,dir:{...ZERO},next:{...ZERO}});
const position=a=>({x:a.tx+.5+a.dir.x*a.progress,y:a.ty+.5+a.dir.y*a.progress});
function open(map,x,y){return map[wrap(y)][wrap(x)]===0;}
function canMove(map,a,d){return (d.x!==0||d.y!==0)&&open(map,a.tx+d.x,a.ty+d.y);}
function maze(random=Math.random){
 const map=Array.from({length:N},()=>Array(N).fill(1)),stack=[{x:1,y:1}];map[1][1]=0;
 while(stack.length){
  const p=stack[stack.length-1],choices=DIRS.filter(d=>{const x=p.x+2*d.x,y=p.y+2*d.y;return x>0&&y>0&&x<N-1&&y<N-1&&map[y][x]===1;});
  if(!choices.length){stack.pop();continue;}
  const d=choices[Math.floor(random()*choices.length)],q={x:p.x+2*d.x,y:p.y+2*d.y};map[p.y+d.y][p.x+d.x]=0;map[q.y][q.x]=0;stack.push(q);
 }
 for(let i=0;i<N;i++){map[12][i]=0;map[i][12]=0;}
 return map;
}
function distanceField(map,x,y){
 const distances=new Int16Array(N*N).fill(-1),queue=[{x,y}];distances[key(x,y)]=0;
 for(let i=0;i<queue.length;i++){
  const p=queue[i];for(const d of DIRS){const nx=wrap(p.x+d.x),ny=wrap(p.y+d.y),k=key(nx,ny);if(open(map,nx,ny)&&distances[k]<0){distances[k]=distances[key(p.x,p.y)]+1;queue.push({x:nx,y:ny});}}
 }
 return distances;
}
class Game{
 constructor(random=Math.random){this.random=random;this.state='idle';this.score=0;this.life=3;this.stage=1;this.powerTime=0;this.invulnerable=0;this.map=maze(random);this.player=actor(1,1);this.ghosts=[];this.pellets=new Set();this.powerPellets=new Set();this.notice='STARTを押してね！';this.noticeTime=0;this.field=null;}
 say(text,seconds=2.5){this.notice=text;this.noticeTime=seconds;}
 start(){this.score=0;this.life=3;this.stage=1;this.newStage();this.state='playing';this.say('STAGE 1 — START!');}
 spawnSpots(){const distances=distanceField(this.map,1,1),spots=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(distances[key(x,y)]>12)spots.push({x,y});return spots;}
 resetActors(){
  this.player=actor(1,1);const spots=this.spawnSpots();
  this.ghosts=COLORS.map(color=>{const i=Math.floor(this.random()*spots.length),p=spots.splice(i,1)[0]||{x:23,y:23};return {...actor(p.x,p.y),color,home:{...p},cooldown:0};});
  this.field=null;this.invulnerable=1.5;
 }
 newStage(){
  this.map=maze(this.random);this.pellets=new Set();this.powerPellets=new Set();
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(open(this.map,x,y)&&!(x===1&&y===1))this.pellets.add(key(x,y));
  for(const [x,y] of [[1,23],[23,1],[23,23],[12,12]]){this.pellets.delete(key(x,y));this.powerPellets.add(key(x,y));}
  this.powerTime=0;this.resetActors();
 }
 direction(name){
  if(this.state!=='playing')return;
  const d=DIRS.find(d=>d.name===name);if(!d)return;const p=this.player;
  // Reverse on the same edge, preserving the exact visible position, including tunnels.
  if(p.progress>EPS&&d.x===-p.dir.x&&d.y===-p.dir.y){p.tx=wrap(p.tx+p.dir.x);p.ty=wrap(p.ty+p.dir.y);p.progress=1-p.progress;p.dir={x:d.x,y:d.y};}
  p.next={x:d.x,y:d.y};
 }
 togglePause(){if(this.state==='playing')this.state='paused';else if(this.state==='paused')this.state='playing';}
 move(a,speed,dt,choose,onArrive){
  let remaining=speed*dt;
  while(remaining>EPS){
   if(a.progress<EPS){a.progress=0;choose(a);if(!canMove(this.map,a,a.dir)){a.dir={...ZERO};return;}}
   const amount=Math.min(remaining,1-a.progress);a.progress+=amount;remaining-=amount;
   if(a.progress>=1-EPS){a.tx=wrap(a.tx+a.dir.x);a.ty=wrap(a.ty+a.dir.y);a.progress=0;if(onArrive&&onArrive()===false)return;}
  }
 }
 collect(){
  const k=key(this.player.tx,this.player.ty);
  if(this.pellets.delete(k))this.score+=10;
  if(this.powerPellets.delete(k)){this.score+=50;this.powerTime=8;this.say('パワーアップ！ 敵を食べると200点');}
 }
 chooseGhost(g){
  let choices=DIRS.filter(d=>canMove(this.map,g,d));if(!choices.length){g.dir={...ZERO};return;}
  if(this.powerTime>0){const forward=choices.filter(d=>d.x!==-g.dir.x||d.y!==-g.dir.y);if(forward.length)choices=forward;g.dir={...choices[Math.floor(this.random()*choices.length)]};return;}
  const tile=key(this.player.tx,this.player.ty);
  if(!this.field||this.field.tile!==tile)this.field={tile,values:distanceField(this.map,this.player.tx,this.player.ty)};
  let best=choices[0],distance=Infinity;
  for(const d of choices){const n=this.field.values[key(wrap(g.tx+d.x),wrap(g.ty+d.y))];if(n>=0&&n<distance){distance=n;best=d;}}
  g.dir={...best};
 }
 collide(){
  const p=position(this.player);
  for(const g of this.ghosts){
   if(g.cooldown>0)continue;const q=position(g);let dx=Math.abs(p.x-q.x),dy=Math.abs(p.y-q.y);dx=Math.min(dx,N-dx);dy=Math.min(dy,N-dy);
   if(Math.hypot(dx,dy)>.65)continue;
   if(this.powerTime>0){this.score+=200;const spots=this.spawnSpots(),spot=spots[Math.floor(this.random()*spots.length)]||g.home;Object.assign(g,actor(spot.x,spot.y),{cooldown:1});}
   else if(this.invulnerable<=0){this.life--;this.powerTime=0;if(this.life===0){this.state='over';this.say('GAME OVER — STARTで再挑戦',0);}else{this.resetActors();this.say('残り '+this.life+' LIFE！');}return;}
  }
 }
 update(dt){
  if(this.state!=='playing')return;
  this.powerTime=Math.max(0,this.powerTime-dt);this.invulnerable=Math.max(0,this.invulnerable-dt);
  if(this.noticeTime>0){this.noticeTime=Math.max(0,this.noticeTime-dt);if(!this.noticeTime)this.notice='';}
  // A legacy save may place an uneaten pellet under the stationary player.
  this.collect();
  this.move(this.player,5.5,dt,p=>{if(canMove(this.map,p,p.next))p.dir={...p.next};},()=>this.collect());
  if(!this.pellets.size&&!this.powerPellets.size){this.stage++;this.newStage();this.say('STAGE '+this.stage+' — START!');return;}
  const speed=Math.min(2.5,.65+(this.stage-1)*.12);
  for(const g of this.ghosts){g.cooldown=Math.max(0,g.cooldown-dt);this.move(g,speed,dt,a=>this.chooseGhost(a));}
  this.collide();
 }
 snapshot(){
  const spots=set=>[...set].map(k=>({x:k%N,y:Math.floor(k/N)}));
  return {version:4,score:this.score,life:this.life,stage:this.stage,map:this.map,pellets:spots(this.pellets),powerPellets:spots(this.powerPellets),player:this.player,ghosts:this.ghosts,powerTime:this.powerTime,invulnerable:this.invulnerable,state:this.state};
 }
 restore(data){
  const d=validateSave(data); // Validate fully before touching the current game.
  Object.assign(this,d);this.field=null;this.say(this.state==='over'?'GAME OVER — STARTで再挑戦':'引き継ぎ成功！ 一時停止中です',0);
 }
}
function validateSave(d){
 const fail=()=>{throw new Error('invalid save');};
 if(!d||![3,4].includes(d.version))fail();
 const integer=(n,min,max)=>Number.isSafeInteger(n)&&n>=min&&n<=max;
 if(!integer(d.score,0,Number.MAX_SAFE_INTEGER)||!integer(d.life,0,3)||!integer(d.stage,1,1000000))fail();
 if(!Array.isArray(d.map)||d.map.length!==N||!d.map.every(row=>Array.isArray(row)&&row.length===N&&row.every(v=>v===0||v===1)))fail();
 const map=d.map.map(row=>row.slice());if(!open(map,1,1))fail();
 // Keep outer borders closed except for matching opposite tunnel entrances.
 for(let i=0;i<N;i++){if(i!==12&&(map[0][i]!==1||map[24][i]!==1||map[i][0]!==1||map[i][24]!==1))fail();}
 if(map[0][12]!==map[24][12]||map[12][0]!==map[12][24])fail();
 const reachable=distanceField(map,1,1);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(map[y][x]===0&&reachable[key(x,y)]<0)fail();
 const point=p=>p&&integer(p.x,0,24)&&integer(p.y,0,24)&&open(map,p.x,p.y);
 const direction=v=>v&&integer(v.x,-1,1)&&integer(v.y,-1,1)&&Math.abs(v.x)+Math.abs(v.y)<=1;
 const readActor=a=>{
  if(!a||!point({x:a.tx,y:a.ty})||!direction(a.dir)||!direction(a.next)||!Number.isFinite(a.progress)||a.progress<0||a.progress>=1)fail();
  if(a.progress>0&&!canMove(map,a,a.dir))fail();
  return {tx:a.tx,ty:a.ty,progress:a.progress,dir:{x:a.dir.x,y:a.dir.y},next:{x:a.next.x,y:a.next.y}};
 };
 const readPellets=list=>{if(!Array.isArray(list)||list.length>N*N)fail();const set=new Set();for(const p of list){if(!point(p)||set.has(key(p.x,p.y)))fail();set.add(key(p.x,p.y));}return set;};
 const pellets=readPellets(d.pellets),powerPellets=readPellets(d.powerPellets);for(const k of pellets)if(powerPellets.has(k))fail();
 if(!Array.isArray(d.ghosts)||d.ghosts.length!==4)fail();
 const ghosts=d.ghosts.map((g,i)=>{const a=readActor(g);if(!point(g.home))fail();const cooldown=d.version===3?0:g.cooldown;if(!Number.isFinite(cooldown)||cooldown<0||cooldown>1)fail();return {...a,color:COLORS[i],home:{x:g.home.x,y:g.home.y},cooldown};});
 if(!Number.isFinite(d.powerTime)||d.powerTime<0||d.powerTime>8)fail();
 if(d.version===4&&(!['playing','paused','over'].includes(d.state)||!Number.isFinite(d.invulnerable)||d.invulnerable<0||d.invulnerable>1.5||(d.state==='over')!==(d.life===0)))fail();
 return {map,pellets,powerPellets,player:readActor(d.player),ghosts,score:d.score,life:d.life,stage:d.stage,powerTime:d.powerTime,invulnerable:d.version===3?1.5:d.invulnerable,state:d.life===0?'over':'paused'};
}
function encodeSave(data){const bytes=new TextEncoder().encode(JSON.stringify(data));let binary='';for(const b of bytes)binary+=String.fromCharCode(b);return btoa(binary);}
function decodeSave(code){if(typeof code!=='string'||code.length>100000)throw new Error('invalid length');const raw=atob(code.replace(/\s/g,''));return JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(raw,c=>c.charCodeAt(0))));}

const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),game=new Game();
let previous=0,accumulator=0,swipe=null,uiSignature='';
function drawCopies(a,paint){
 const p=position(a);for(const ox of [-N,0,N])for(const oy of [-N,0,N]){const x=(p.x+ox)*S,y=(p.y+oy)*S;if(x>=-S&&x<=600+S&&y>=-S&&y<=600+S)paint(x,y);}
}
function draw(now){
 ctx.clearRect(0,0,600,600);ctx.fillStyle='#02030a';ctx.fillRect(0,0,600,600);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(game.map[y][x]){ctx.fillStyle='#101b65';ctx.fillRect(x*S,y*S,S,S);ctx.strokeStyle='#526cff';ctx.lineWidth=1;ctx.strokeRect(x*S+3,y*S+3,S-6,S-6);}
 ctx.fillStyle='#ffe9b0';for(const k of game.pellets){ctx.beginPath();ctx.arc((k%N+.5)*S,(Math.floor(k/N)+.5)*S,2.5,0,Math.PI*2);ctx.fill();}
 ctx.fillStyle='#fff';for(const k of game.powerPellets){ctx.beginPath();ctx.arc((k%N+.5)*S,(Math.floor(k/N)+.5)*S,5.5+Math.sin(now/170),0,Math.PI*2);ctx.fill();}
 for(const g of game.ghosts)drawCopies(g,(x,y)=>{
  ctx.globalAlpha=g.cooldown>0?.45:1;ctx.fillStyle=game.powerTime>0?(game.powerTime<2&&Math.floor(now/180)%2?'#fff':'#315aff'):g.color;
  ctx.beginPath();ctx.arc(x,y-1,9,Math.PI,0);ctx.lineTo(x+9,y+9);ctx.lineTo(x+4.5,y+6);ctx.lineTo(x,y+9);ctx.lineTo(x-4.5,y+6);ctx.lineTo(x-9,y+9);ctx.closePath();ctx.fill();
  for(const side of [-1,1]){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+side*3.5,y-1,2.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+side*3.5+g.dir.x,y-1+g.dir.y,1.3,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
 });
 drawCopies(game.player,(x,y)=>{
  ctx.globalAlpha=game.invulnerable>0&&Math.floor(now/100)%2?.5:1;
  const p=game.player,angle=Math.atan2(p.dir.y,p.dir.x),mouth=game.state==='playing'?.12+Math.abs(Math.sin(now/85))*.35:.24;
  ctx.fillStyle='#ffe600';ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,S*.43,angle+mouth,angle+Math.PI*2-mouth);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
 });
 if(game.powerTime>0){ctx.fillStyle='#7dfcff';ctx.font='bold 14px system-ui';ctx.textAlign='left';ctx.fillText('POWER '+game.powerTime.toFixed(1)+'s',10,20);}
 if(game.state!=='playing'){
  ctx.fillStyle='#02030ab8';ctx.fillRect(0,0,600,600);ctx.textAlign='center';ctx.fillStyle='#ffe600';ctx.font='bold 34px system-ui';ctx.fillText({idle:'READY?',paused:'PAUSED',over:'GAME OVER'}[game.state],300,285);ctx.fillStyle='#fff';ctx.font='17px system-ui';ctx.fillText(game.state==='paused'?'RESUME または Space で再開':'START でゲーム開始',300,320);
 }
 const signature=[game.score,game.life,game.stage,game.state,game.notice].join('|');
 if(signature!==uiSignature){uiSignature=signature;$('score').textContent=game.score;$('life').textContent=game.life;$('stage').textContent=game.stage;$('pause').disabled=!['playing','paused'].includes(game.state);$('pause').textContent=game.state==='paused'?'▶ RESUME':'Ⅱ PAUSE';$('pause').setAttribute('aria-pressed',String(game.state==='paused'));$('message').textContent=game.state==='paused'?'一時停止中 — RESUMEで再開':game.notice;}
}
function frame(now){
 const elapsed=previous?Math.max(0,Math.min((now-previous)/1000,.1)):0;previous=now;
 if(game.state==='playing'){accumulator+=elapsed;while(accumulator>=STEP){game.update(STEP);accumulator-=STEP;if(game.state!=='playing'){accumulator=0;break;}}}else accumulator=0;
 draw(now);requestAnimationFrame(frame);
}
function resetClock(){previous=0;accumulator=0;}
function pause(){game.togglePause();resetClock();}
$('start').addEventListener('click',()=>{game.start();resetClock();});$('pause').addEventListener('click',pause);
const KEYS={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};
document.addEventListener('keydown',e=>{
 if(e.target.closest('input,textarea,select,[contenteditable="true"]')||e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key.toLowerCase();if(KEYS[k]){e.preventDefault();game.direction(KEYS[k]);}
 if(k===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();if(!e.repeat)pause();}
});
for(const d of DIRS){const button=$(d.name);button.addEventListener('pointerdown',e=>{if(e.isPrimary===false||e.button!==0)return;e.preventDefault();game.direction(d.name);});button.addEventListener('click',()=>game.direction(d.name));}
canvas.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;swipe={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!swipe||swipe.id!==e.pointerId)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if(Math.hypot(dx,dy)<14)return;game.direction(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));swipe.x=e.clientX;swipe.y=e.clientY;});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>{swipe=null;});
function backgroundPause(){if(game.state==='playing'){game.togglePause();resetClock();}swipe=null;}
document.addEventListener('visibilitychange',()=>{if(document.hidden)backgroundPause();});window.addEventListener('blur',backgroundPause);
$('copy').addEventListener('click',async()=>{
 if(game.state==='idle'){$('save-status').textContent='先にゲームを開始してね';return;}
 const code=encodeSave(game.snapshot());$('savecode').value=code;
 // Freeze the snapshot while the user handles the code or changes apps.
 if(game.state==='playing')pause();
